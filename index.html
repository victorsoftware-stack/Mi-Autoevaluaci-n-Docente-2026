<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoevaluación Docente 2026 · CSDB</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#14295a;--navy2:#1F3864;--blue:#2E75B6;--sky:#e8f0fb;--gold:#c99a2e;--gold2:#f3e3b5;--ink:#18203a;--mut:#667089;--line:#e2e7f0;--bg:#f4f6fb;--ok:#2e7d32;--r:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 400px at 85% -10%,#3b6fc1 0%,transparent 60%),linear-gradient(135deg,#0f2049,#1F3864 60%,#24427a);color:#fff;padding:26px 20px 64px}
.hero:after{content:"";position:absolute;right:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(201,154,46,.18)}
.hero .in{max-width:880px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.brand img.crest{width:72px;height:72px;border-radius:16px;background:#fff;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.25);object-fit:contain}
.brand{font-size:14px!important}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--gold);display:grid;place-items:center;font-style:normal;font-weight:800;color:#14295a}
.hero h1{font-family:Fraunces,Georgia,serif;font-size:clamp(26px,4.4vw,38px);margin:14px 0 4px;line-height:1.1}
.hero p{margin:0;opacity:.85;font-size:15px}
nav.tabs{display:inline-flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:999px;margin-top:16px}
nav.tabs button{border:0;background:none;color:#fff;padding:7px 14px;border-radius:999px;font:600 13px inherit;cursor:pointer;opacity:.8}
nav.tabs button.on{background:#fff;color:var(--navy);opacity:1}
main{max-width:880px;margin:-44px auto 0;padding:0 16px 70px;position:relative;z-index:2}
.steps{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 6px 24px rgba(20,41,90,.08);position:sticky;top:10px;z-index:10;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:1;min-width:44px;border:0;background:none;border-radius:999px;padding:8px 10px;font:600 12.5px inherit;color:var(--mut);cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.steps button b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--navy);font-size:11px}
.steps button.done b{background:var(--ok);color:#fff}
.steps button.on{background:var(--navy);color:#fff}.steps button.on b{background:var(--gold);color:var(--navy)}
.steps button span{display:none}@media(min-width:760px){.steps button.on span{display:inline}}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;margin-top:16px;box-shadow:0 10px 40px rgba(20,41,90,.06);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.panel h2{font-family:Fraunces,Georgia,serif;font-size:26px;margin:4px 0 6px;color:var(--navy);line-height:1.2}
.lead{color:var(--mut);margin:0 0 20px;font-size:15px}
.field{margin:0 0 20px}.field>label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
input[type=text],textarea,select{width:100%;font:16px inherit;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fbfcfe;color:var(--ink);transition:border .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(46,117,182,.12);background:#fff}
textarea{min-height:92px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font:600 14px inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .15s}
.chip:hover{border-color:var(--blue);transform:translateY(-1px)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(20,41,90,.2)}
.chip .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--gold2);color:var(--navy)}
.chip.on .av{background:var(--gold);color:var(--navy)}
.chip.star{border-color:var(--gold)}
.q{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px;transition:all .2s;background:#fff}
.q.ans{border-color:#cfe3cf;background:#fbfefb}.q.miss{border-color:#f2b8b5;background:#fff8f7;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.q p{margin:0 0 12px;font-weight:600;font-size:15.5px;display:flex;gap:10px}
.q p em{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:800}
.q.ans p em{background:var(--ok);color:#fff}
.sc{display:grid;grid-template-columns:repeat(4,1fr) .7fr;gap:8px}
@media(max-width:620px){.sc{grid-template-columns:repeat(2,1fr)}.sc button:last-child{grid-column:span 2}}
.sc button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px 8px;cursor:pointer;font:600 13px inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .15s}
.sc button:hover{transform:translateY(-2px);border-color:#b9c7dc}
.dots{display:flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:#dfe5ee}
.sc button[data-v="4"] .dots i{background:#2e7d32}.sc button[data-v="3"] .dots i:nth-child(-n+3){background:#7cb342}.sc button[data-v="2"] .dots i:nth-child(-n+2){background:#f2b705}.sc button[data-v="1"] .dots i:nth-child(1){background:#e57373}
.sc button.on{color:#fff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.sc button.on .dots i{background:rgba(255,255,255,.95)!important}
.sc button.on[data-v="4"]{background:#2e7d32;border-color:#2e7d32}.sc button.on[data-v="3"]{background:#7cb342;border-color:#7cb342}
.sc button.on[data-v="2"]{background:#e9a800;border-color:#e9a800}.sc button.on[data-v="1"]{background:#e05d5d;border-color:#e05d5d}.sc button.on[data-v="NA"]{background:#8c96a6;border-color:#8c96a6}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 22px;font:700 15px inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.pri{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(20,41,90,.25)}
.btn.gold{background:linear-gradient(135deg,#d8ad45,#b8862a);color:#fff;box-shadow:0 8px 20px rgba(184,134,42,.3)}
.btn.ghost{background:transparent;color:var(--mut)}.btn.sec{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.msg{padding:12px 16px;border-radius:12px;font-size:14px;margin:14px 0 0;display:none}
.msg.show{display:block;animation:in .25s}.msg.ok{background:#e8f5e9;color:#1b5e20}.msg.err{background:#fdecea;color:#8a1c1c}.msg.info{background:var(--sky);color:var(--navy)}
.welcome{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
@media(max-width:700px){.welcome{grid-template-columns:1fr}.welcome svg{display:none}}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.feat{background:var(--bg);border-radius:14px;padding:12px;font-size:13.5px;color:var(--mut)}.feat b{display:block;color:var(--navy);font-size:14px}
/* reporte */
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px}
.lvl-Superior{background:#d7efd8;color:#1b5e20}.lvl-Alto{background:#e6f2d6;color:#33691e}.lvl-Básico{background:#fff1c2;color:#7a5b00}.lvl-Bajo{background:#ffd9d6;color:#8a1c1c}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:linear-gradient(180deg,#f7f9fd,#eef3fb);border-radius:16px;padding:16px;text-align:center}
.kpi b{display:block;font-size:28px;color:var(--navy);font-weight:800;line-height:1.1}.kpi span{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:16px;padding:16px}
.box h3{margin:0 0 10px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
.hb{display:grid;grid-template-columns:minmax(120px,42%) 1fr 36px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.hb .t{height:12px;background:#edf1f7;border-radius:99px;overflow:hidden}.hb .t i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hb .v{text-align:right;font-weight:800}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:9px 6px;text-align:left;border-bottom:1px solid #eef1f6}
table.st th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.synth{background:linear-gradient(180deg,#fffdf6,#fbf6e8);border:1px solid #efe2bd;padding:16px 18px;border-radius:16px;font-size:15px;position:relative}
.synth:before{content:"“";position:absolute;top:-14px;left:14px;font:700 54px Fraunces,serif;color:var(--gold)}
ul.l{margin:6px 0 4px 0;padding:0;list-style:none;font-size:14px}ul.l li{padding:6px 0 6px 24px;position:relative;border-bottom:1px dashed #eef1f6}
ul.l.f li:before{content:"✓";position:absolute;left:2px;color:var(--ok);font-weight:800}ul.l.o li:before{content:"↗";position:absolute;left:2px;color:#c77c00;font-weight:800}
.radar{width:100%;max-width:360px;display:block;margin:0 auto}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:24px 0 4px}
.sent{display:none;text-align:center;padding:10px}.sent.show{display:block;animation:in .4s}
.sent .ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:32px;margin:0 auto 8px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
#pdfOv{position:fixed;inset:0;background:rgba(14,24,52,.55);z-index:50;display:grid;place-items:center;padding:16px;animation:in .2s}
.ovbox{background:#fff;border-radius:20px;width:min(900px,100%);max-height:94vh;display:flex;flex-direction:column;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ovhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ovbox iframe{width:100%;height:68vh;border:1px solid var(--line);border-radius:12px;background:#f4f6fb}
.ovtip{font-size:13px;color:var(--mut);margin:10px 0 0;text-align:center}
a.btn{text-decoration:none}
.final-note{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#fff7e0,#fbecc2);border:1.5px solid #e7c96b;color:#5a4300;border-radius:14px;padding:14px 16px;margin:16px 0 0;font-size:15.5px}
.final-note span b{color:#14295a}
.q p span{font-weight:500}.q p span b{font-weight:800;color:#14295a}
a.feat-link{text-decoration:none;display:block;border:1.5px solid #e7c96b;background:#fff8e6;transition:transform .15s}a.feat-link:hover{transform:translateY(-2px)}a.feat-link u{color:#14295a;font-weight:700}
.final-note a{color:#14295a;font-weight:800;text-decoration:underline}.final-note .url{font-size:12px;color:#7a6420;word-break:break-all;margin-top:4px}
.chk{margin-top:12px;padding:12px;border-radius:12px;background:#f6f8fc;display:flex;flex-direction:column;gap:6px}
.chk-t{font-size:13px;font-weight:700;color:var(--blue)}
.chkb{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:500 14px inherit;color:var(--ink);cursor:pointer;transition:all .15s}
.chkb i{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid #b9c7dc;display:grid;place-items:center;font-style:normal;font-size:12px;color:transparent}
.chkb.on{border-color:#2e7d32;background:#f1f9f1}.chkb.on i{background:#2e7d32;border-color:#2e7d32;color:#fff}
ul.chkl li:before{position:absolute;left:2px;font-weight:800}ul.chkl li.y:before{content:"✓";color:#2e7d32}ul.chkl li.n:before{content:"○";color:#9aa4b2}ul.chkl li.n{color:var(--mut)}
.hidden{display:none!important}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>

const fname=n=>"Autoevaluacion_2026_"+(n||"docente").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_")+".pdf";
let downloads=null,db=null,uid=null,user=null,prevSent="";
async function deliver(blob,name,msgEl,okTxt){
  if(downloads){try{await downloads.save({filename:name,data:blob});showMsg(msgEl,"ok",okTxt);return}
    catch(e){if(e&&e.code==="declined"){showMsg(msgEl,"info","Descarga cancelada.");return}if(e&&e.code==="rate_limited"){showMsg(msgEl,"info","Ya hay una descarga en curso; intente de nuevo en un momento.");return}}}
  const url=URL.createObjectURL(blob);
  try{const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}catch(e){}
  openViewer(url,name,blob.type!=="application/pdf");if(msgEl)msgEl.className="msg";
}
function openViewer(url,name,isFile){
  let ov=$("pdfOv");if(ov)ov.remove();ov=document.createElement("div");ov.id="pdfOv";
  ov.innerHTML=`<div class="ovbox"><div class="ovhead"><div><div class="eyebrow">Su archivo está listo</div><b>${esc(name)}</b></div><button class="btn ghost" id="ovX">✕ Cerrar</button></div>
  ${isFile?"":`<iframe src="${url}#view=FitH" title="Informe PDF"></iframe>`}
  <p class="ovtip">${isFile?"Si la descarga no inició sola, use el botón de abajo.":"Si la descarga no inició sola, use el botón <b>⬇ Descargar</b> del visor (arriba a la derecha del documento) o abra el archivo en una pestaña nueva."}</p>
  <div class="actions" style="margin:10px 0 0"><a class="btn gold" href="${url}" download="${esc(name)}" target="_blank" rel="noopener">⬇ Descargar / abrir el archivo</a></div></div>`;
  document.body.appendChild(ov);$("ovX").onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};
}
async function savePdf(r,msgEl){
  if(!window.jspdf){showMsg(msgEl,"err","No se pudo cargar el generador de PDF. Revise su conexión y recargue la página.");return}
  showMsg(msgEl,"info","Generando su informe…");
  await deliver(pdfBlob(r),fname(r.nombre),msgEl,"✓ Informe PDF descargado. Ya puede enviarlo o adjuntarlo donde lo necesite.");
}
